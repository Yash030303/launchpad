
name: Website CI

# When should this workflow run?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Permissions required by this workflow
permissions:
  contents: read

# The jobs that GitHub Actions will execute
jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code to the runner
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Check that required files exist
      - name: Check required website files
        run: |
          test -f index.html
          test -f about.html
          test -f services.html
          test -f projects.html
          test -f contact.html
          test -f assets/css/style.css
          test -f assets/js/main.js

      # Step 3: Check that the files are not empty
      - name: Check website files are not empty
        run: |
          test -s index.html
          test -s about.html
          test -s services.html
          test -s projects.html
          test -s contact.html
          test -s assets/css/style.css
          test -s assets/js/main.js

      # Step 4: Display repository files in the log
      - name: List repository files
        run: |
          echo "Files in the repository:"
          ls -la

      # Step 5: Display a success message
      - name: Complete validation
        run: echo "Website validation completed successfully!"
