name: Website CI Update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          set -eu

          test -f index.html
          test -f about.html
          test -f services.html
          test -f projects.html
          test -f contact.html
          test -f assets/css/style.css
          test -f assets/js/main.js

          echo "All required website files exist."

      - name: Check page navigation links
        run: |
          set -eu

          for page in index.html about.html services.html projects.html contact.html; do
            echo "Checking navigation in $page"

            grep -Fq 'href="index.html"' "$page"
            grep -Fq 'href="about.html"' "$page"
            grep -Fq 'href="services.html"' "$page"
            grep -Fq 'href="projects.html"' "$page"
            grep -Fq 'href="contact.html"' "$page"
          done

          echo "All page navigation links are present."

      - name: Check CSS and JavaScript references
        run: |
          set -eu

          for page in index.html about.html services.html projects.html contact.html; do
            echo "Checking assets in $page"

            grep -Fq 'assets/css/style.css' "$page"
            grep -Fq 'assets/js/main.js' "$page"
          done

          echo "CSS and JavaScript references are present."


      - name: Show files being checked
        run: find . -maxdepth 3 -type f -not -path './.git/*' | sort
